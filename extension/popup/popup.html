<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Whisper Paperwork</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="popup.css" />
</head>
<body>

  <!-- ── Header ─────────────────────────────────────────────── -->
  <header class="header">
    <div class="header-brand">
      <div class="brand-icon">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/>
          <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
          <line x1="12" y1="19" x2="12" y2="22"/>
        </svg>
      </div>
      <div>
        <div class="brand-name">Whisper Paperwork</div>
        <div class="brand-tagline">Voice → Form filling</div>
      </div>
    </div>
    <div id="tab-pill" class="tab-pill tab-pill--checking">
      <span class="tab-pill__dot"></span>
      <span id="tab-pill-text">Checking…</span>
    </div>
  </header>


  <!-- ── Form info card ──────────────────────────────────────── -->
  <section class="card" id="section-form">
    <div class="card-label">Detected Form</div>
    <div class="form-row">
      <span class="form-title" id="form-title-text">No form on this tab</span>
      <span class="field-badge" id="form-question-count">0 fields</span>
    </div>
  </section>

  <!-- ── Actions ────────────────────────────────────────────── -->
  <section class="actions-section">

    <button id="btn-parse-fields" class="action-btn" disabled>
      <span class="action-btn__icon">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polyline points="8 17 12 21 16 17"/><line x1="12" y1="21" x2="12" y2="3"/></svg>
      </span>
      <span class="action-btn__label">Parse Form Fields</span>
      <span class="action-btn__step">Step 1</span>
    </button>

    <button id="btn-record-audio" class="action-btn" disabled>
      <span class="action-btn__icon" id="mic-icon">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="22"/></svg>
      </span>
      <span class="action-btn__label" id="mic-label">Record Audio Response</span>
      <span class="action-btn__step">Step 2</span>
    </button>

    <button id="btn-open-panel" class="action-btn action-btn--highlight">
      <span class="action-btn__icon">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="9" y1="3" x2="9" y2="21"/></svg>
      </span>
      <span class="action-btn__label">Open Interview Panel</span>
      <span class="action-btn__step">On page</span>
    </button>

    <button id="btn-fill" class="action-btn action-btn--success" disabled>
      <span class="action-btn__icon">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polyline points="20 6 9 17 4 12"/></svg>
      </span>
      <span class="action-btn__label">Fill Form Fields</span>
      <span class="action-btn__step">Step 3</span>
    </button>

  </section>

  <!-- ── Transcript result ───────────────────────────────────── -->
  <div id="result-box" class="result-box hidden">
    <div class="result-row">
      <span class="result-label">Transcript</span>
      <div id="transcript-preview" class="result-content"></div>
    </div>
    <div class="result-row" style="margin-top: 6px;">
      <span class="result-label">Mapped</span>
      <div id="mapped-preview" class="result-content result-content--mono"></div>
    </div>
  </div>

  <!-- ── Fill progress ──────────────────────────────────────── -->
  <div id="fill-progress" class="fill-progress hidden">
    <div class="progress-track">
      <div id="progress-fill" class="progress-bar-fill" style="width: 0%"></div>
    </div>
    <span id="progress-text" class="progress-label">Filling…</span>
  </div>

  <!-- ── Log ────────────────────────────────────────────────── -->
  <div id="log" class="log"></div>

  <script src="popup.js"></script>
</body>
</html>
